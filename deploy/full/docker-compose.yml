# ═══════════════════════════════════════════════════════════════════
# DIADEMA – Docker Compose full stack (Girder + Nginx + workers)
# ═══════════════════════════════════════════════════════════════════
# Avvio: docker compose up -d
# Prerequisiti:
#   1. cp .env.example .env  (e personalizza i valori)
#   2. cp /path/to/freesurfer_license.txt ./freesurfer_license.txt
# ═══════════════════════════════════════════════════════════════════

x-celery-env: &celery-env
  CELERY_BROKER_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//"
  CELERY_RESULT_BACKEND: "mongodb://mongodb:27017/${MONGO_DB:-girder}"
  CELERY_BROKER_HEARTBEAT: "0"
  CELERY_WORKER_CANCEL_LONG_RUNNING_TASKS_ON_CONNECTION_LOSS: "true"
  PYTHONUNBUFFERED: "1"

x-girder-env: &girder-env
  <<: *celery-env
  GIRDER_MONGO_URI: "mongodb://mongodb:27017/${MONGO_DB:-girder}"
  GIRDER_REDIS_URL: "redis://redis:6379"
  GIRDER_NOTIFICATION_REDIS_URL: "redis://redis:6379"
  BROKER_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//"
  # I job (server → worker → Girder) viaggiano su HTTPS terminato da nginx.
  # nginx inoltra a girder:8080 in rete interna. Il cert è self-signed: la CA
  # interna è montata nei container e indicata da REQUESTS_CA_BUNDLE così che
  # GirderClient/requests verifichino il certificato senza disabilitare la verifica.
  GIRDER_WORKER_CALLBACK_URL: "https://nginx/api/v1"
  GIRDER_API_URL: "https://nginx/api/v1"
  REQUESTS_CA_BUNDLE: /etc/nginx/certs/ca.crt

x-worker-deps: &worker-deps
  depends_on:
    rabbitmq:
      condition: service_healthy
    mongodb:
      condition: service_healthy
    girder:
      condition: service_healthy
    init-certs:
      condition: service_completed_successfully

# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Infrastruttura ──────────────────────────────────────────────────────────

  mongodb:
    image: mongo:7.0
    container_name: diadema-full-mongodb
    networks: [diadema-full-net]
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-girder}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: diadema-full-redis
    networks: [diadema-full-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: diadema-full-rabbitmq
    networks: [diadema-full-net]
    restart: unless-stopped
    depends_on:
      init-rabbitmq-certs:
        condition: service_completed_successfully
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_certs:/etc/rabbitmq/certs:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-diadema.conf:ro
    ports:
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
      # AMQPS per i worker remoti: esporre SOLO sull'interfaccia/subnet del
      # tunnel WireGuard (regola firewall a livello host), mai su Internet
      # direttamente. 5672 (AMQP in chiaro) resta interno alla rete Docker.
      - "${RABBITMQ_AMQPS_PORT:-5671}:5671"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Copia i certificati generati da init-certs in un volume dedicato, di
  # proprietà dell'utente rabbitmq. NOTA: uid/gid 100:101, non 999 — quello
  # vale per l'immagine Debian-based, ma qui usiamo la variante
  # rabbitmq:3-management-alpine, dove l'utente "rabbitmq" ha uid/gid
  # diversi (verificato con `id rabbitmq` dentro l'immagine). Il volume
  # `certs` condiviso con girder/worker resta 640 root:root e non è
  # leggibile dal processo rabbitmq, che gira come utente non-root.
  init-rabbitmq-certs:
    image: alpine:3
    container_name: diadema-full-init-rabbitmq-certs
    networks: [diadema-full-net]
    user: root
    depends_on:
      init-certs:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        set -e
        cp /certs/ca.crt /certs/server.crt /certs/server.key /rabbitmq-certs/
        chown -R 100:101 /rabbitmq-certs
        chmod 600 /rabbitmq-certs/server.key
        chmod 644 /rabbitmq-certs/ca.crt /rabbitmq-certs/server.crt
        echo "Certificati copiati per RabbitMQ (owner uid/gid 100:101, immagine alpine)"
    volumes:
      - certs:/certs:ro
      - rabbitmq_certs:/rabbitmq-certs
    restart: "no"

  # Crea (idempotente, via API management) l'utente dedicato ai worker
  # remoti, sullo STESSO vhost "/" dei worker locali (un vhost separato
  # isolerebbe il worker remoto dalle code esistenti e richiederebbe di
  # cambiare anche il lato produttore dei task). L'isolamento è dato dai
  # permessi, ristretti via regex alle sole code che si sceglie di
  # offloadare (default: diadema_mriqc) — non alle code degli altri
  # worker (celery, freesurfer, lstai) né a exchange/management.
  init-rabbitmq-remote:
    image: alpine:3
    container_name: diadema-full-init-rabbitmq-remote
    networks: [diadema-full-net]
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      REMOTE_WORKER_USER: ${REMOTE_WORKER_USER:-remote-worker}
      REMOTE_WORKER_PASS: ${REMOTE_WORKER_PASS:-changeme_remote_worker}
      # Regex sui nomi di coda/exchange accessibili al worker remoto.
      # Aggiungere altre code (es. "|freesurfer|lstai") solo se si
      # offloadano da remoto anche quelle pipeline.
      REMOTE_WORKER_QUEUES_REGEX: ${REMOTE_WORKER_QUEUES_REGEX:-^diadema_mriqc$}
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache curl >/dev/null
        BASE="http://rabbitmq:15672/api"
        AUTH="${RABBITMQ_USER}:${RABBITMQ_PASS}"
        curl -sf -u "$$AUTH" -X PUT "$$BASE/users/$$REMOTE_WORKER_USER" \
          -H "content-type: application/json" \
          -d "{\"password\":\"$$REMOTE_WORKER_PASS\",\"tags\":\"\"}"
        curl -sf -u "$$AUTH" -X PUT "$$BASE/permissions/%2F/$$REMOTE_WORKER_USER" \
          -H "content-type: application/json" \
          -d "{\"configure\":\"$$REMOTE_WORKER_QUEUES_REGEX\",\"write\":\"$$REMOTE_WORKER_QUEUES_REGEX\",\"read\":\"$$REMOTE_WORKER_QUEUES_REGEX\"}"
        echo "Utente '$$REMOTE_WORKER_USER' pronto su vhost '/' (permessi limitati a: $$REMOTE_WORKER_QUEUES_REGEX)"
    restart: "no"

  # ── Gateway WireGuard verso il cluster K8s remoto ───────────────────────────
  # Tunnel punto-punto: nessun routing L3 verso il resto della rete Docker,
  # solo inoltro esplicito (socat) delle porte 5671 (RabbitMQ AMQPS) e 443
  # (nginx HTTPS) verso il peer nel tunnel. Il cluster K8s (IP fisso) fa da
  # lato "server" WireGuard: qui non serve aprire nessuna porta in ingresso,
  # solo traffico UDP in uscita verso WG_PEER_ENDPOINT. Vedi
  # deploy/k8s-remote-worker/wireguard-gateway.yaml per il lato speculare.
  wireguard-gateway:
    image: alpine:3
    container_name: diadema-full-wireguard-gateway
    networks: [diadema-full-net]
    depends_on:
      rabbitmq:
        condition: service_healthy
      nginx:
        condition: service_started
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun
    environment:
      WG_PRIVATE_KEY: ${WG_PRIVATE_KEY:?impostare WG_PRIVATE_KEY in .env}
      WG_ADDRESS: ${WG_ADDRESS:-10.90.0.1/24}
      WG_LISTEN_PORT: ${WG_LISTEN_PORT:-51820}
      WG_PEER_PUBLIC_KEY: ${WG_PEER_PUBLIC_KEY:?impostare WG_PEER_PUBLIC_KEY in .env}
      WG_PEER_ALLOWED_IPS: ${WG_PEER_ALLOWED_IPS:-10.90.0.2/32}
      # host:porta pubblicati dal cluster K8s remoto (Service NodePort UDP).
      WG_PEER_ENDPOINT: ${WG_PEER_ENDPOINT:?impostare WG_PEER_ENDPOINT in .env (IP fisso cluster:porta NodePort)}
      FORWARD_5671_TARGET: rabbitmq:5671
      FORWARD_443_TARGET: nginx:443
    volumes:
      - ./wireguard/entrypoint.sh:/entrypoint.sh:ro
    command: ["sh", "/entrypoint.sh"]
    restart: unless-stopped

  init-permissions:
    image: alpine:3
    container_name: diadema-full-init-permissions
    networks: [diadema-full-net]
    user: root
    command:
      - sh
      - -c
      - |
        mkdir -p /data/assetstore /tmp/diadema_cache
        chown -R 1000:1000 /data
        echo "Permessi corretti su /data"
    volumes:
      - girder_assetstore:/data/assetstore
    restart: "no"

  # ── Generazione certificati TLS (CA interna self-signed) ────────────────────
  # Genera una CA interna + certificato server nel volume `certs`, condiviso con
  # nginx (terminazione TLS) e con i container client (girder + worker) che
  # verificano il certificato via REQUESTS_CA_BUNDLE. Idempotente: se il cert
  # esiste già non rigenera nulla, così la CA resta stabile tra i riavvii.
  init-certs:
    image: alpine:3
    container_name: diadema-full-init-certs
    networks: [diadema-full-net]
    user: root
    environment:
      DIADEMA_PUBLIC_HOST: ${DIADEMA_PUBLIC_HOST:-localhost}
      # SAN aggiuntivi separati da virgola (es. il Service K8s del gateway
      # WireGuard per i worker remoti: "wireguard-gateway.diadema-remote.svc.cluster.local").
      # Necessario perché il client TLS (kombu/amqps) verifica l'hostname a
      # cui si connette, non solo la catena di certificazione: senza il SAN
      # corrispondente la connessione fallirebbe anche con la CA corretta.
      DIADEMA_EXTRA_SAN: ${DIADEMA_EXTRA_SAN:-}
    command:
      - sh
      - -c
      - |
        set -e
        if [ -f /certs/server.crt ]; then
          echo "Certificati già presenti in /certs, skip generazione"
          exit 0
        fi
        apk add --no-cache openssl >/dev/null
        cd /certs
        echo "Genero CA interna DIADEMA..."
        openssl req -x509 -newkey rsa:4096 -nodes -keyout ca.key -out ca.crt \
          -days 3650 -subj "/O=DIADEMA/CN=DIADEMA Internal CA"
        # $$ lascia la variabile alla shell del container (espansa da `environment`,
        # con default localhost). Con $ singolo la sostituirebbe docker compose,
        # producendo un SAN vuoto se la var non è nel .env.
        SAN="DNS:nginx,DNS:localhost,DNS:$$DIADEMA_PUBLIC_HOST,IP:127.0.0.1"
        if [ -n "$$DIADEMA_EXTRA_SAN" ]; then
          for name in $$(echo "$$DIADEMA_EXTRA_SAN" | tr ',' ' '); do
            SAN="$$SAN,DNS:$$name"
          done
        fi
        echo "Genero certificato server (SAN: $$SAN)..."
        openssl req -newkey rsa:4096 -nodes -keyout server.key -out server.csr \
          -subj "/O=DIADEMA/CN=$$DIADEMA_PUBLIC_HOST"
        cat > san.cnf <<EOF
        subjectAltName=$$SAN
        EOF
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
          -out server.crt -days 825 -extfile san.cnf
        rm -f server.csr san.cnf
        chmod 640 server.key ca.key
        echo "Certificati generati in /certs"
    volumes:
      - certs:/certs
    restart: "no"

  # ── Girder server ───────────────────────────────────────────────────────────

  girder:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: diadema-girder:latest
    container_name: diadema-full-girder
    networks: [diadema-full-net]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
      init-certs:
        condition: service_completed_successfully
    environment:
      <<: *girder-env
      GIRDER_ADMIN_LOGIN: ${GIRDER_ADMIN_LOGIN:-admin}
      GIRDER_ADMIN_PASSWORD: ${GIRDER_ADMIN_PASSWORD:-changeme_admin}
      GIRDER_ADMIN_EMAIL: ${GIRDER_ADMIN_EMAIL:-admin@example.com}
      GIRDER_ADMIN_FIRST_NAME: ${GIRDER_ADMIN_FIRST_NAME:-Admin}
      GIRDER_ADMIN_LAST_NAME: ${GIRDER_ADMIN_LAST_NAME:-User}
      GIRDER_ADMIN_RESET_PASSWORD: ${GIRDER_ADMIN_RESET_PASSWORD:-false}
      GIRDER_ASSETSTORE_PATH: ${GIRDER_ASSETSTORE_PATH:-/data/assetstore}
      GIRDER_ASSETSTORE_NAME: ${GIRDER_ASSETSTORE_NAME:-Primary Assetstore}
      GIRDER_BRAND_NAME: ${GIRDER_BRAND_NAME:-DIADEMA}
      GIRDER_REGISTRATION_POLICY: ${GIRDER_REGISTRATION_POLICY:-closed}
      GIRDER_EMAIL_VERIFICATION: ${GIRDER_EMAIL_VERIFICATION:-disabled}
      GIRDER_ENABLE_PASSWORD_LOGIN: ${GIRDER_ENABLE_PASSWORD_LOGIN:-true}
    volumes:
      - ../../:/workspace
      - girder_data:/home/girder/.local
      - girder_assetstore:${GIRDER_ASSETSTORE_PATH:-/data/assetstore}
      - certs:/etc/nginx/certs:ro   # ca.crt per REQUESTS_CA_BUNDLE
    ports:
      - "8081:8080"   # Girder UI diretta (admin/debug)
    entrypoint: ["/sbin/tini", "--"]
    command: ["bash", "/workspace/deploy/testing/entrypoint-girder.sh", "serve"]
    user: girder
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v1/system/version"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: diadema-full-nginx
    networks: [diadema-full-net]
    depends_on:
      girder:
        condition: service_healthy
      init-certs:
        condition: service_completed_successfully
    ports:
      - "${NGINX_PORT:-80}:80"            # redirect 80 → 443
      - "${NGINX_HTTPS_PORT:-443}:443"    # entry point HTTPS
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    restart: unless-stopped

  # ── Celery worker ───────────────────────────────────────────────────────────

  celery-worker:
    image: diadema-girder:latest
    container_name: diadema-full-celery-worker
    networks: [diadema-full-net]
    <<: *worker-deps
    environment:
      <<: *girder-env
    volumes:
      - ../../:/workspace
      - girder_data:/home/girder/.local
      - certs:/etc/nginx/certs:ro
    entrypoint: ["/sbin/tini", "--"]
    command: ["bash", "/workspace/deploy/testing/entrypoint-girder.sh", "worker"]
    user: girder
    restart: unless-stopped

  # ── DIADEMA MRIQC worker ────────────────────────────────────────────────────

  diadema-mriqc-worker:
    build:
      context: ../../
      dockerfile: diadema-mriqc-worker/Dockerfile
    image: diadema-diadema-mriqc-worker:latest
    container_name: diadema-full-diadema-mriqc-worker
    networks: [diadema-full-net]
    <<: *worker-deps
    environment:
      <<: *celery-env
      C_FORCE_ROOT: "1"
      GIRDER_API_URL: "https://nginx/api/v1"
      REQUESTS_CA_BUNDLE: /etc/nginx/certs/ca.crt
      DIADEMA_MRIQC_OUTPUT_DIR: /data/diadema/mriqc
    volumes:
      # Il plugin è baked nell'immagine (install non-editable al build)
      - diadema_mriqc_data:/data/diadema/mriqc
      - certs:/etc/nginx/certs:ro
    restart: unless-stopped

  # ── FreeSurfer worker ───────────────────────────────────────────────────────

  diadema-freesurfer-worker:
    build:
      context: ../../
      dockerfile: freesurfer-worker/Dockerfile
    image: diadema-freesurfer-worker:latest
    container_name: diadema-full-freesurfer-worker
    networks: [diadema-full-net]
    <<: *worker-deps
    environment:
      <<: *celery-env
      C_FORCE_ROOT: "1"
      GIRDER_API_URL: "https://nginx/api/v1"
      REQUESTS_CA_BUNDLE: /etc/nginx/certs/ca.crt
      FS_LICENSE: /usr/local/freesurfer/license.txt
      DIADEMA_SUBJECTS_DIR: /data/diadema/subjects
    volumes:
      # Il plugin è baked nell'immagine (install non-editable al build)
      - diadema_subjects_data:/data/diadema/subjects
      - ${FREESURFER_LICENSE_PATH:-./freesurfer_license.txt}:/usr/local/freesurfer/license.txt:ro
      - certs:/etc/nginx/certs:ro
    restart: unless-stopped

  # ── LST-AI worker ───────────────────────────────────────────────────────────

  diadema-lstai-worker:
    build:
      context: ../../
      dockerfile: lst-worker/Dockerfile
    image: diadema-lstai-worker:latest
    container_name: diadema-full-lstai-worker
    networks: [diadema-full-net]
    <<: *worker-deps
    environment:
      <<: *celery-env
      C_FORCE_ROOT: "1"
      GIRDER_API_URL: "https://nginx/api/v1"
      REQUESTS_CA_BUNDLE: /etc/nginx/certs/ca.crt
      DIADEMA_LSTAI_OUTPUT_DIR: /data/diadema/lstai
    volumes:
      # Il plugin è baked nell'immagine (install non-editable al build)
      - diadema_lstai_data:/data/diadema/lstai
      - certs:/etc/nginx/certs:ro
    restart: unless-stopped
    # Decommentare su host con GPU NVIDIA (richiesto se si lancia con useGpu=true):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

# ─────────────────────────────────────────────────────────────────────────────

networks:
  diadema-full-net:
    driver: bridge
    name: diadema-full-network

volumes:
  mongodb_data:
    name: diadema-full-mongodb
  rabbitmq_data:
    name: diadema-full-rabbitmq
  rabbitmq_certs:
    name: diadema-full-rabbitmq-certs
  girder_data:
    name: diadema-full-girder-data
  girder_assetstore:
    name: diadema-full-girder-assetstore
  certs:
    name: diadema-full-certs
  diadema_mriqc_data:
    name: diadema-full-mriqc-output
  diadema_subjects_data:
    name: diadema-full-freesurfer-subjects
  diadema_lstai_data:
    name: diadema-full-lstai-output
