# ═══════════════════════════════════════════════════════════════════
# DIADEMA – Nginx reverse proxy configuration
#
# Routing:
#   /api/v1/*   → Girder REST API
#   /static/*   → Girder static assets
#   /girder/*   → Girder built-in web UI (for admin access)
#   /ws         → Trame WebSocket (required for reactive UI)
#   /*          → Trame application (catch-all)
# ═══════════════════════════════════════════════════════════════════

upstream girder {
    server girder:8080;
    keepalive 32;
}

upstream trame {
    server trame:8888;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Timeouts for long-running requests (medical image processing) ──
    proxy_connect_timeout       60s;
    proxy_send_timeout          300s;
    proxy_read_timeout          300s;

    # ── Girder API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://girder;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Girder's CORS and cookie handling
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Large file uploads (NIfTI files can be several hundred MB)
        client_max_body_size 2g;
        proxy_request_buffering off;
    }

    # ── Girder static assets ────────────────────────────────────────
    location /static/ {
        proxy_pass http://girder;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # ── Girder built-in web UI (admin access) ───────────────────────
    # Girder serves its UI at the root (/) with relative assets under /assets.
    # The trailing slash on proxy_pass strips the /girder/ prefix:
    #   /girder/            → Girder /            (HTML)
    #   /girder/assets/x.js → Girder /assets/x.js (relative assets resolve)
    # API XHRs hit /api/v1 (served by the /api/ block); Girder uses hash routing.
    location /girder/ {
        proxy_pass http://girder/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Trame WebSocket ─────────────────────────────────────────────
    # Critical: must be BEFORE the catch-all / location
    location /ws {
        proxy_pass http://trame;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Trame wslink endpoint (WebSocket + HTTP) ──────────────────────
    location ~ ^/paraview {
        proxy_pass http://trame;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Trame app (catch-all) ────────────────────────────────────────
    location / {
        proxy_pass http://trame;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
