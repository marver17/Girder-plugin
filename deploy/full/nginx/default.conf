# ═══════════════════════════════════════════════════════════════════
# DIADEMA – Nginx reverse proxy configuration (Girder 5)
#
# Tuned per the Girder deployment guide:
#   https://girder.readthedocs.io/en/latest/deployment.html
#   - long timeouts for large file transfers
#   - buffering disabled for streaming up/downloads
#   - WebSocket upgrade headers for the ASGI app
#
# Routing:
#   /api/*    → Girder REST API
#   /static/* → Girder static assets
#   /*        → Girder web client (catch-all)
# ═══════════════════════════════════════════════════════════════════

upstream girder {
    server girder:8080;
    keepalive 32;
}

# Map the Upgrade header so WebSocket connections are proxied correctly
# while normal requests keep a clean (empty) Connection header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ── HTTP → HTTPS redirect ───────────────────────────────────────────
# Tutto il traffico in chiaro viene reindirizzato all'endpoint TLS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS endpoint (TLS terminato qui, proxy interno in HTTP) ────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificato server firmato dalla CA interna DIADEMA (volume `certs`,
    # generato dal servizio init-certs). SAN: nginx, localhost, host pubblico.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Timeouts for long-running requests (medical image processing) ──
    proxy_connect_timeout       600s;
    proxy_send_timeout          600s;
    proxy_read_timeout          600s;

    # ── Large file uploads (NIfTI files can be several hundred MB) ──────
    client_max_body_size 2g;

    # ── Streaming: disable buffering as recommended by Girder ──────────
    proxy_buffering         off;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support for the ASGI app
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # ── Girder API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://girder;
    }

    # ── Girder static assets ────────────────────────────────────────
    location /static/ {
        proxy_pass http://girder;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # ── Girder web client (catch-all) ───────────────────────────────
    location / {
        proxy_pass http://girder;
    }
}
