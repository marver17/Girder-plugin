# ScaledJob KEDA: crea un Job Kubernetes per ogni messaggio in coda su
# "diadema_mriqc" (fino a maxReplicaCount job paralleli), invece di tenere
# worker sempre accesi in idle. Richiede KEDA installato sul cluster
# remoto e il RabbitMQ scaler (keda.sh/scalers/rabbitmq).
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: diadema-mriqc-worker-remote
  namespace: diadema-remote
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    # Evita job appesi indefinitamente (dataset corrotto, tool in loop).
    # Allineare a un multiplo del timeout applicativo di MRIQC (kwargs
    # `timeout`, default 1800s in tasks/mriqc.py).
    activeDeadlineSeconds: 5400
    backoffLimit: 0
    template:
      metadata:
        labels:
          app: diadema-mriqc-worker-remote
      spec:
        priorityClassName: diadema-remote-batch
        restartPolicy: Never
        imagePullSecrets:
          - name: ghcr-pull-secret
        containers:
          - name: diadema-mriqc-worker
            # Pubblicata su ghcr.io/marver17/diadema-mriqc-worker (push manuale,
            # vedi README.md prerequisito 4). Aggiornare il tag ad ogni rebuild:
            # non c'è automazione CI che ripubblichi l'immagine ad ogni commit.
            image: ghcr.io/marver17/diadema-mriqc-worker:latest
            # Comando esplicito (non solo "args": l'immagine ha ENTRYPOINT []
            # vuoto, "args" da solo sostituirebbe l'intero CMD invece di
            # completarlo — vedi nota sopra "resources"). Rispetto al CMD di
            # default aggiunge --without-gossip/--mingle/--heartbeat: senza,
            # celery prova a dichiarare l'exchange "reply.celery.pidbox" per
            # il proprio protocollo di controllo tra worker, a cui l'utente
            # RabbitMQ remoto (permessi ristretti a "diadema_mriqc", vedi
            # REMOTE_WORKER_QUEUES_REGEX) non ha accesso per design — fallisce
            # con "403 ACCESS_REFUSED" (verificato con un job reale sul
            # cluster). Non necessario qui: un solo worker, nessun peer con
            # cui fare gossip/mingle.
            command:
              - celery
              - -A
              - girder_worker.app
              - worker
              - --queues=diadema_mriqc
              - --loglevel=info
              - --pool=solo
              - --concurrency=1
              - --heartbeat-interval=0
              - --include=girder_diadema_pipeline.tasks
              - --without-gossip
              - --without-mingle
              - --without-heartbeat
            envFrom:
              - secretRef:
                  name: diadema-remote-rabbitmq
            env:
              - name: C_FORCE_ROOT
                value: "1"
              # Service in-namespace del gateway WireGuard (wireguard-gateway.yaml):
              # nessun IP/hostname del sito Girder referenziato direttamente.
              - name: GIRDER_API_URL
                value: "https://wireguard-gateway.diadema-remote.svc.cluster.local/api/v1"
              - name: REQUESTS_CA_BUNDLE
                value: /etc/diadema/certs/ca.crt
              - name: DIADEMA_MRIQC_OUTPUT_DIR
                value: /data/diadema/mriqc
              - name: CELERY_BROKER_HEARTBEAT
                value: "0"
              - name: CELERY_WORKER_CANCEL_LONG_RUNNING_TASKS_ON_CONNECTION_LOSS
                value: "true"
              # Un Job k8s (completions=1) si aspetta che il container
              # termini da sé a lavoro fatto: "celery worker" di per sé
              # resta vivo in ascolto sulla coda anche a task finito, e il
              # pod resterebbe "Running" fino ad activeDeadlineSeconds
              # (marcato Failed/DeadlineExceeded anche a successo). Con
              # questa variabile (letta in worker_entry.py) il worker si
              # arresta da solo (SIGTERM graceful) dopo un task — coerente
              # con un job per pod, uno per messaggio in coda.
              - name: DIADEMA_WORKER_MAX_TASKS
                value: "1"
            # Nessun "args" qui: il CMD dell'immagine (Dockerfile) include già
            # --queues=diadema_mriqc e --concurrency=1. L'immagine ha
            # ENTRYPOINT [] (vuoto) — un "args" qui sostituirebbe l'intero CMD
            # invece di completarlo, e Kubernetes proverebbe a eseguire il
            # primo elemento come binario (visto in test: "exec: \"--queues=...\":
            # executable file not found in $PATH").
            resources:
              # Valori aggiornati dopo un test reale su un T1w di dimensioni
              # cliniche tipiche: con limit=8Gi il pod è stato OOMKilled a
              # metà elaborazione MRIQC. 16Gi limit copre quel caso con
              # margine; ricalibrare ulteriormente se serve in base al
              # dataset reale (dimensioni/risoluzione dei volumi).
              requests:
                cpu: "2"
                memory: "6Gi"
              limits:
                cpu: "4"
                memory: "16Gi"
            volumeMounts:
              - name: ca-bundle
                mountPath: /etc/diadema/certs
                readOnly: true
              - name: mriqc-output
                mountPath: /data/diadema/mriqc
        volumes:
          - name: ca-bundle
            secret:
              secretName: diadema-remote-ca
          - name: mriqc-output
            emptyDir: {}
  pollingInterval: 15
  maxReplicaCount: 5
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  triggers:
    - type: rabbitmq
      metadata:
        queueName: diadema_mriqc
        # Un job per messaggio in coda: adeguato a task lunghi e pesanti
        # come MRIQC, dove non ha senso accumulare più messaggi per pod.
        mode: QueueLength
        value: "1"
        # NON "tls: enable" qui: il campo EnableTLS dello scaler RabbitMQ di
        # KEDA (rabbitmq_scaler.go, tag `order=authParams`) viene letto SOLO
        # da TriggerAuthentication, mai dal metadata del trigger — un valore
        # messo qui viene silenziosamente ignorato (resta "disable" lato
        # KEDA). Con EnableTLS="disable" nessun tls.Config con la CA interna
        # viene costruito, ma la libreria AMQP tenta comunque TLS perché
        # l'URL è "amqps://", usando il pool di CA di sistema — che non
        # conosce la nostra CA interna: da qui "x509: certificate signed by
        # unknown authority" anche con la CA giusta configurata (verificato
        # analizzando il sorgente KEDA v2.20.2 e confermato live sul
        # cluster). Il valore va invece nella chiave "TLS" del secret
        # diadema-remote-rabbitmq, referenziata da TriggerAuthentication
        # sotto (parameter: tls) — vedi anche ca/cert/key, stesso pattern.
      authenticationRef:
        name: diadema-remote-rabbitmq-trigger-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: diadema-remote-rabbitmq-trigger-auth
  namespace: diadema-remote
spec:
  secretTargetRef:
    - parameter: host
      name: diadema-remote-rabbitmq
      key: CELERY_BROKER_URL
    # CA interna DIADEMA: necessaria allo scaler KEDA per verificare il
    # certificato server AMQPS attraverso il tunnel (stessa CA usata dal
    # worker via REQUESTS_CA_BUNDLE, vedi secret diadema-remote-ca).
    - parameter: ca
      name: diadema-remote-ca
      key: ca.crt
    # Letto da EnableTLS (order=authParams, vedi commento nel trigger sopra):
    # deve stare qui, non nel metadata del trigger.
    - parameter: tls
      name: diadema-remote-rabbitmq
      key: TLS
