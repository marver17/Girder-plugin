# Template — NON applicare direttamente e NON committare con valori reali.
# Creare i secret veri con `kubectl create secret` (vedi README.md) o con un
# secret manager (sealed-secrets, external-secrets, vault) secondo la policy
# della struttura che ospita il cluster remoto.
apiVersion: v1
kind: Secret
metadata:
  name: diadema-remote-rabbitmq
  namespace: diadema-remote
type: Opaque
stringData:
  # Utente dedicato creato da init-rabbitmq-remote (deploy/full/docker-compose.yml),
  # permessi ristretti via regex alla/e sola/e coda/e offloadata/e da remoto.
  # Host = Service in-namespace del gateway WireGuard (wireguard-gateway.yaml),
  # che inoltra attraverso il tunnel fino a RabbitMQ del sito Girder.
  CELERY_BROKER_URL: "amqps://<REMOTE_WORKER_USER>:<REMOTE_WORKER_PASS>@wireguard-gateway.diadema-remote.svc.cluster.local:5671//"
  # Nessun result backend Mongo per i worker remoti: MongoDB non deve
  # comunque essere raggiungibile dal cluster remoto per restare "gestione
  # interna". NON usare "rpc://": richiede diritti di scrittura sull'exchange
  # di default "amq.default" per pubblicare il risultato per-task, negati
  # all'utente RabbitMQ "remote-worker" (permessi ristretti alla sola coda
  # offloadata). Causava `amqp.exceptions.AccessRefused` a fine task e
  # lasciava il Job Girder bloccato a RUNNING (verificato con un job MRIQC
  # reale sul cluster K8s). "cache+memory://" è un backend locale in-processo,
  # senza alcuna dipendenza di rete, coerente con l'isolamento voluto qui.
  # NON impostare task_ignore_result=True lato worker per "risparmiare"
  # anche questo backend: girder_worker usa lo stato tracciato da Celery per
  # decidere quando chiudere il Job, con ignore_result=True non lo fa mai
  # (vedi worker_entry.py).
  CELERY_RESULT_BACKEND: "cache+memory://"
  # Letto dallo scaler KEDA (TriggerAuthentication, parameter "tls") per
  # verificare TLS sulla connessione AMQPS con la CA interna, ANALOGO ma
  # indipendente dal TLS del worker stesso. NON mettere "tls: enable" nel
  # metadata del trigger in scaledjob-mriqc.yaml: lì viene ignorato
  # silenziosamente (bug/comportamento non documentato di KEDA 2.20.2, il
  # campo è letto solo da TriggerAuthentication) e la connessione dello
  # scaler fallisce con "x509: certificate signed by unknown authority"
  # anche con la CA giusta configurata altrove, perché senza questo valore
  # KEDA non costruisce alcun tls.Config con la CA e la libreria AMQP
  # ripiega sul pool di certificati di sistema (verificato analizzando il
  # sorgente KEDA e confermato live sul cluster K8s).
  TLS: "enable"
---
apiVersion: v1
kind: Secret
metadata:
  name: diadema-remote-ca
  namespace: diadema-remote
type: Opaque
stringData:
  # Contenuto di ca.crt estratto dal volume `certs` (init-certs) — usato
  # come REQUESTS_CA_BUNDLE dal worker per verificare l'endpoint HTTPS di
  # Girder senza disabilitare la verifica TLS.
  ca.crt: |
    <CONTENUTO_CA_CRT>
---
apiVersion: v1
kind: Secret
metadata:
  name: diadema-remote-freesurfer-license
  namespace: diadema-remote
type: Opaque
stringData:
  # Contenuto di freesurfer-worker/license.txt (fuori repo il file reale,
  # solo questo template è versionato). Montato via subPath su
  # /usr/local/freesurfer/license.txt in scaledjob-freesurfer.yaml — non
  # passato come env var perché multi-riga.
  license.txt: |
    <CONTENUTO_LICENSE_TXT>
