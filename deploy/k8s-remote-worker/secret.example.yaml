# Template — NON applicare direttamente e NON committare con valori reali.
# Creare i secret veri con `kubectl create secret` (vedi README.md) o con un
# secret manager (sealed-secrets, external-secrets, vault) secondo la policy
# della struttura che ospita il cluster remoto.
apiVersion: v1
kind: Secret
metadata:
  name: diadema-remote-rabbitmq
  namespace: diadema-remote
type: Opaque
stringData:
  # Utente dedicato creato da init-rabbitmq-remote (deploy/full/docker-compose.yml),
  # permessi ristretti via regex alla/e sola/e coda/e offloadata/e da remoto.
  # Host = Service in-namespace del gateway WireGuard (wireguard-gateway.yaml),
  # che inoltra attraverso il tunnel fino a RabbitMQ del sito Girder.
  CELERY_BROKER_URL: "amqps://<REMOTE_WORKER_USER>:<REMOTE_WORKER_PASS>@wireguard-gateway.diadema-remote.svc.cluster.local:5671//"
  # Nessun result backend Mongo per i worker remoti: i task DIADEMA hanno già
  # task_ignore_result=True (worker_entry.py), e MongoDB non deve comunque
  # essere raggiungibile dal cluster remoto per restare "gestione interna".
  CELERY_RESULT_BACKEND: "rpc://"
---
apiVersion: v1
kind: Secret
metadata:
  name: diadema-remote-ca
  namespace: diadema-remote
type: Opaque
stringData:
  # Contenuto di ca.crt estratto dal volume `certs` (init-certs) — usato
  # come REQUESTS_CA_BUNDLE dal worker per verificare l'endpoint HTTPS di
  # Girder senza disabilitare la verifica TLS.
  ca.crt: |
    <CONTENUTO_CA_CRT>
