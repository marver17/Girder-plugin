# ──────────────────────────────────────────────────────────────────────────────
# Snippet docker-compose per DIADEMA Pipeline workers
# ──────────────────────────────────────────────────────────────────────────────
# Incolla i blocchi necessari sotto la sezione `services:` nel docker-compose.yml
# principale.  I tre worker sono indipendenti: puoi aggiungerne solo alcuni.
#
# Prerequisiti:
#   - Copiare .env.example → .env e compilare le variabili
#   - Avere i Dockerfile in:
#       diadema-mriqc-worker/Dockerfile
#       freesurfer-worker/Dockerfile
# ──────────────────────────────────────────────────────────────────────────────

# ── Worker MRI QC (coda: diadema_mriqc) ──────────────────────────────────────

diadema-mriqc-worker:
  build:
    context: .
    dockerfile: diadema-mriqc-worker/Dockerfile
  container_name: girder-diadema-mriqc-worker
  networks:
    - girder-dev-net
  depends_on:
    rabbitmq:
      condition: service_healthy
    mongodb:
      condition: service_healthy
  environment:
    - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-girder}:${RABBITMQ_PASS:-girder}@rabbitmq:5672//
    - CELERY_RESULT_BACKEND=mongodb://mongodb:27017/girder
    - PYTHONUNBUFFERED=1
    - C_FORCE_ROOT=1
    - GIRDER_API_URL=http://girder:8080/api/v1
    - CELERY_BROKER_HEARTBEAT=0
    - CELERY_WORKER_CANCEL_LONG_RUNNING_TASKS_ON_CONNECTION_LOSS=true
    # Directory output persistente MRIQC (sovrascrivibile anche via Settings admin)
    - DIADEMA_MRIQC_OUTPUT_DIR=${DIADEMA_MRIQC_OUTPUT_DIR:-/data/diadema/mriqc}
  volumes:
    - ./diadema_pipeline:/opt/diadema_pipeline # live-edit senza rebuild
    - diadema_mriqc_data:/data/diadema/mriqc # output persistente
  restart: unless-stopped

# ── Worker FreeSurfer (coda: freesurfer) ─────────────────────────────────────

diadema-freesurfer-worker:
  build:
    context: .
    dockerfile: freesurfer-worker/Dockerfile
  container_name: girder-diadema-freesurfer-worker
  networks:
    - girder-dev-net
  depends_on:
    rabbitmq:
      condition: service_healthy
    mongodb:
      condition: service_healthy
  environment:
    - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-girder}:${RABBITMQ_PASS:-girder}@rabbitmq:5672//
    - CELERY_RESULT_BACKEND=mongodb://mongodb:27017/girder
    - PYTHONUNBUFFERED=1
    - C_FORCE_ROOT=1
    - GIRDER_API_URL=http://girder:8080/api/v1
    - CELERY_BROKER_HEARTBEAT=0
    - CELERY_WORKER_CANCEL_LONG_RUNNING_TASKS_ON_CONNECTION_LOSS=true
    - FS_LICENSE=/usr/local/freesurfer/license.txt
    # Directory SUBJECTS_DIR FreeSurfer (sovrascrivibile anche via Settings admin)
    - DIADEMA_SUBJECTS_DIR=${DIADEMA_SUBJECTS_DIR:-/data/diadema/subjects}
  volumes:
    - ./diadema_pipeline:/opt/diadema_pipeline # live-edit senza rebuild
    - diadema_subjects_data:/data/diadema/subjects # output persistente
  restart: unless-stopped

# ── Volumi da dichiarare nella sezione volumes: ───────────────────────────────
# Aggiungi questi sotto la sezione `volumes:` principale:
#
#   diadema_mriqc_data:
#     name: girder-diadema-mriqc-output
#   diadema_subjects_data:
#     name: girder-diadema-subjects

