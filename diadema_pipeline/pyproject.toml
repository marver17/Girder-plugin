[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "girder-diadema-pipeline"
version = "0.1.0"
description = "DIADEMA Pipeline – MRI QC, FreeSurfer, LST-AI via Girder Worker"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Mario Verdicchio", email = "marioverd95@gmail.com"}
]
keywords = ["girder", "neuroimaging", "mriqc", "freesurfer", "lst-ai", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "girder>=5.0.0a1",
    "girder-worker>=5.0.0a1",
    "girder-plugin-worker>=5.0.0a1",
    "girder-client>=5.0.0a1",
    "nibabel>=5.2.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-girder>=3.0",
]

[project.entry-points."girder.plugin"]
diadema_pipeline = "girder_diadema_pipeline:DiademaPlugin"

[project.entry-points."girder_worker_plugins"]
diadema_pipeline_tasks = "girder_diadema_pipeline.worker_entry:load_worker_plugin"

[tool.setuptools.packages.find]
include = ["girder_diadema_pipeline*"]

[tool.setuptools.package-data]
girder_diadema_pipeline = [
    "web_client/dist/*.js",
    "web_client/dist/*.cjs",
    "web_client/dist/*.map",
]
