services:
  # MongoDB per Girder
  mongodb:
    image: mongo:4.4
    container_name: girder-dev-mongodb
    networks:
      - girder-dev-net
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=girder
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017" # solo localhost in produzione
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis per caching e sessioni
  redis:
    image: redis:7-alpine
    container_name: girder-dev-redis
    networks:
      - girder-dev-net
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: girder-dev-rabbitmq
    networks:
      - girder-dev-net
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672" # solo localhost in produzione
      - "127.0.0.1:15672:15672" # Management UI: solo localhost
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-girder}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-girder}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Girder Development
  girder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: girder-dev
    networks:
      - girder-dev-net
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - GIRDER_MONGO_URI=mongodb://mongodb:27017/girder
      - GIRDER_REDIS_URL=redis://redis:6379
      - GIRDER_NOTIFICATION_REDIS_URL=redis://redis:6379
      - BROKER_URL=amqp://${RABBITMQ_USER:-girder}:${RABBITMQ_PASS:-girder}@rabbitmq:5672//
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-girder}:${RABBITMQ_PASS:-girder}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=mongodb://mongodb:27017/girder
      - PYTHONUNBUFFERED=1
      # URL usato dal server Girder quando costruisce i messaggi Celery per i worker.
      # Deve essere raggiungibile dagli altri container (usa hostname Docker, non localhost).
      - GIRDER_WORKER_CALLBACK_URL=http://girder:8080/api/v1
    volumes:
      - .:/workspace
      - ./oauth2:/girder/oauth2
      - girder_data:/home/girder/.local
      - girder_node_modules:/girder/girder/web/node_modules
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true
    user: girder
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/system/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # DIADEMA – MRI QC worker (nipreps/mriqc, coda diadema_mriqc)
  diadema-mriqc-worker:
    build:
      context: .
      dockerfile: diadema-mriqc-worker/Dockerfile
    container_name: girder-diadema-mriqc-worker
    networks:
      - girder-dev-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-girder}:${RABBITMQ_PASS:-girder}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=mongodb://mongodb:27017/girder
      - PYTHONUNBUFFERED=1
      - C_FORCE_ROOT=1
      - GIRDER_API_URL=http://girder:8080/api/v1
      - CELERY_BROKER_HEARTBEAT=0
      - CELERY_WORKER_CANCEL_LONG_RUNNING_TASKS_ON_CONNECTION_LOSS=true
      - DIADEMA_MRIQC_OUTPUT_DIR=${DIADEMA_MRIQC_OUTPUT_DIR:-/data/diadema/mriqc}
    volumes:
      - ./diadema_pipeline:/opt/diadema_pipeline
      - diadema_mriqc_data:/data/diadema/mriqc # output persistente
    # Dev: reinstalla in editable mode dal volume (live-edit di tasks.py).
    # L'immagine contiene già il plugin baked per il deploy.
    command: >
      sh -c "pip install --no-cache-dir --no-build-isolation --no-deps -e /opt/diadema_pipeline &&
             celery -A girder_worker.app worker --queues=diadema_mriqc --loglevel=info
             --pool=solo --concurrency=1 --heartbeat-interval=0
             --include=girder_diadema_pipeline.tasks"
    restart: unless-stopped

  # DIADEMA – FreeSurfer worker (freesurfer/freesurfer:8.1.0, coda freesurfer)
  diadema-freesurfer-worker:
    build:
      context: .
      dockerfile: freesurfer-worker/Dockerfile
    container_name: girder-diadema-freesurfer-worker
    networks:
      - girder-dev-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-girder}:${RABBITMQ_PASS:-girder}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=mongodb://mongodb:27017/girder
      - PYTHONUNBUFFERED=1
      - C_FORCE_ROOT=1
      - GIRDER_API_URL=http://girder:8080/api/v1
      - CELERY_BROKER_HEARTBEAT=0
      - CELERY_WORKER_CANCEL_LONG_RUNNING_TASKS_ON_CONNECTION_LOSS=true
      - FS_LICENSE=/usr/local/freesurfer/license.txt
      - DIADEMA_SUBJECTS_DIR=${DIADEMA_SUBJECTS_DIR:-/data/diadema/subjects}
    volumes:
      - ./diadema_pipeline:/opt/diadema_pipeline
      - diadema_subjects_data:/data/diadema/subjects # output persistente
    # Dev: reinstalla in editable mode dal volume (live-edit di tasks.py).
    command: >
      sh -c "pip install --no-cache-dir --no-build-isolation --no-deps -e /opt/diadema_pipeline &&
             celery -A girder_worker.app worker --queues=freesurfer --loglevel=info
             --pool=solo --concurrency=1 --heartbeat-interval=0
             --include=girder_diadema_pipeline.tasks"
    restart: unless-stopped

  # DIADEMA – LST-AI worker (jqmcginnis/lst-ai:v1.2.0, coda lstai)
  diadema-lstai-worker:
    build:
      context: .
      dockerfile: lst-worker/Dockerfile
    container_name: girder-diadema-lstai-worker
    networks:
      - girder-dev-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-girder}:${RABBITMQ_PASS:-girder}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=mongodb://mongodb:27017/girder
      - PYTHONUNBUFFERED=1
      - C_FORCE_ROOT=1
      - GIRDER_API_URL=http://girder:8080/api/v1
      - CELERY_BROKER_HEARTBEAT=0
      - CELERY_WORKER_CANCEL_LONG_RUNNING_TASKS_ON_CONNECTION_LOSS=true
      - DIADEMA_LSTAI_OUTPUT_DIR=${DIADEMA_LSTAI_OUTPUT_DIR:-/data/diadema/lstai}
    volumes:
      - ./diadema_pipeline:/opt/diadema_pipeline
      - diadema_lstai_data:/data/diadema/lstai # output persistente
    # Dev: reinstalla in editable mode dal volume (live-edit di tasks.py).
    command: >
      sh -c "pip install --no-cache-dir --no-build-isolation --no-deps -e /opt/diadema_pipeline &&
             celery -A girder_worker.app worker --queues=lstai --loglevel=info
             --pool=solo --concurrency=1 --heartbeat-interval=0
             --include=girder_diadema_pipeline.tasks"
    restart: unless-stopped
    # Decommentare su host con GPU NVIDIA (richiesto se si lancia con useGpu=true):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  girder-dev-net:
    driver: bridge
    name: girder-dev-network

volumes:
  mongodb_data:
    name: girder-dev-mongodb
  rabbitmq_data:
    name: girder-dev-rabbitmq
  girder_data:
    name: girder-dev-data
  girder_node_modules:
    name: girder-dev-node-modules
  diadema_mriqc_data:
    name: girder-diadema-mriqc-output
  diadema_subjects_data:
    name: girder-diadema-subjects
  diadema_lstai_data:
    name: girder-diadema-lstai-output
