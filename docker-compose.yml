services:
  # MongoDB per Girder
  mongodb:
    image: mongo:4.4
    container_name: girder-dev-mongodb
    networks:
      - girder-dev-net
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=girder
    restart: unless-stopped
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis per caching e sessioni
  redis:
    image: redis:7-alpine
    container_name: girder-dev-redis
    networks:
      - girder-dev-net
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: girder-dev-rabbitmq
    networks:
      - girder-dev-net
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=girder
      - RABBITMQ_DEFAULT_PASS=girder
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Girder Development
  girder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: girder-dev
    networks:
      - girder-dev-net
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - GIRDER_MONGO_URI=mongodb://mongodb:27017/girder
      - GIRDER_REDIS_URL=redis://redis:6379
      - GIRDER_NOTIFICATION_REDIS_URL=redis://redis:6379
      - BROKER_URL=amqp://girder:girder@rabbitmq:5672//
      - CELERY_BROKER_URL=amqp://girder:girder@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=mongodb://mongodb:27017/girder
      - PYTHONUNBUFFERED=1
      # URL usato dal server Girder quando costruisce i messaggi Celery per i worker.
      # Deve essere raggiungibile dagli altri container (usa hostname Docker, non localhost).
      - GIRDER_WORKER_CALLBACK_URL=http://girder:8080/api/v1
    volumes:
      - .:/workspace
      - ./oauth2:/girder/oauth2
      - girder_data:/home/girder/.local
      - girder_node_modules:/girder/girder/web/node_modules
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true
    user: girder
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/system/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # MRIQC dedicated Celery worker
  # Built on nipreps/mriqc:latest — includes ANTs, FreeSurfer SynthStrip, FSL
  # Consumes jobs from the 'mriqc' queue only
  mriqc-worker:
    build:
      context: .
      dockerfile: mriqc-worker/Dockerfile
    container_name: girder-mriqc-worker
    networks:
      - girder-dev-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=amqp://girder:girder@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=mongodb://mongodb:27017/girder
      - PYTHONUNBUFFERED=1
      # Worker runs as root (nipreps/mriqc base image). Safe in dev because
      # RabbitMQ is on an internal Docker network and messages use JSON, not pickle.
      - C_FORCE_ROOT=1
      # Girder API URL reachable from within the Docker network.
      # The Girder server dispatches jobs with its own localhost URL which is
      # unreachable from other containers — this env var overrides it.
      - GIRDER_API_URL=http://girder:8080/api/v1
      # ── Heartbeat / connection stability ──────────────────────────────────────
      # MRIQC tasks run for 5-30 minutes. With --pool=solo the main thread is
      # blocked during execution, so Celery can't send AMQP heartbeats.
      # RabbitMQ's default heartbeat timeout is 60 s → connection is closed →
      # Celery can't ACK the finished task → message is redelivered → infinite loop.
      # Fix: disable heartbeat on the broker connection (0 = disabled).
      - CELERY_BROKER_HEARTBEAT=0
      # Also cancel tasks on connection loss so they are not silently redelivered
      # when the worker reconnects (belt-and-suspenders with the heartbeat fix).
      - CELERY_WORKER_CANCEL_LONG_RUNNING_TASKS_ON_CONNECTION_LOSS=true
    volumes:
      - ./nifti_qc:/opt/nifti_qc # live-edit tasks.py without rebuild
    restart: unless-stopped

networks:
  girder-dev-net:
    driver: bridge
    name: girder-dev-network

volumes:
  mongodb_data:
    name: girder-dev-mongodb
  rabbitmq_data:
    name: girder-dev-rabbitmq
  girder_data:
    name: girder-dev-data
  girder_node_modules:
    name: girder-dev-node-modules
