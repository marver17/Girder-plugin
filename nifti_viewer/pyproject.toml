[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "girder-nifti-viewer"
version = "1.0.0"
description = "View NIfTI neuroimaging files in Girder with BIDS support and advanced metadata search"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache Software License 2.0"}
authors = [
    {name = "Mario Verdicchio", email = "marioverd95@gmail.com"}
]
keywords = ["girder", "nifti", "neuroimaging", "bids", "medical-imaging", "viewer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "girder>=5.0.0a1",
    "nibabel>=4.0.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-girder>=3.0",
]
dev = [
    "pytest>=6.0",
    "pytest-girder>=3.0",
    "build>=0.7.0",
    "twine>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/marver17/Girder-plugin"
Documentation = "https://github.com/marver17/Girder-plugin/blob/main/README.md"
Repository = "https://github.com/marver17/Girder-plugin"
"Bug Tracker" = "https://github.com/marver17/Girder-plugin/issues"

[project.entry-points."girder.plugin"]
nifti_viewer = "girder_nifti_viewer:NiftiViewerPlugin"

[tool.setuptools]
packages = ["girder_nifti_viewer"]
zip-safe = false

[tool.setuptools.package-data]
girder_nifti_viewer = ["web_client/dist/*"]

[tool.pytest.ini_options]
testpaths = ["plugin_tests"]
python_files = ["*_test.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
