# ──────────────────────────────────────────────────────────────────────────────
# Snippet docker-compose per Plugin Template worker
# ──────────────────────────────────────────────────────────────────────────────
# Aggiungi questo blocco sotto la sezione `services:` nel docker-compose.yml
# principale del progetto.
#
# COME ADATTARE:
#   1. Rinomina il servizio: "plugin-template-worker" → "nome-tuo-plugin-worker"
#   2. Aggiorna context/dockerfile se sposti il Dockerfile
#   3. Aggiorna il volume con il path del tuo plugin
#   4. Rimuovi C_FORCE_ROOT se l'immagine base non richiede root
#   5. Rimuovi CELERY_BROKER_HEARTBEAT se i task durano < 60 s
# ──────────────────────────────────────────────────────────────────────────────

# ── Incolla sotto services: ───────────────────────────────────────────────────

  plugin-template-worker:
    build:
      context: .
      dockerfile: plugin_template/plugin-template-worker/Dockerfile
    container_name: girder-plugin-template-worker
    networks:
      - girder-dev-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=amqp://girder:girder@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=mongodb://mongodb:27017/girder
      - PYTHONUNBUFFERED=1
      # Necessario se l'immagine base gira come root
      - C_FORCE_ROOT=1
      # URL Girder raggiungibile dall'interno del container
      - GIRDER_API_URL=http://girder:8080/api/v1
      # Disabilita heartbeat AMQP (necessario per task > 60 s con --pool=solo)
      # Rimuovi se i tuoi task durano meno di 60 s
      - CELERY_BROKER_HEARTBEAT=0
      - CELERY_WORKER_CANCEL_LONG_RUNNING_TASKS_ON_CONNECTION_LOSS=true
    volumes:
      # Monta il plugin in modalità editable (live-edit tasks.py senza rebuild)
      # In produzione: rimuovi il volume e copia il plugin nel Dockerfile
      - ./plugin_template:/opt/plugin_template
    restart: unless-stopped
