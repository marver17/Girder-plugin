[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diadema-trame"
version = "0.1.0"
description = "DIADEMA neuroimaging platform - Trame UI"
requires-python = ">=3.10"
dependencies = [
    "trame>=3.4",
    "trame-gwc>=0.2",
    "trame-vuetify>=2.7",
    "trame-client>=3.2",
    "trame-vtk>=2.8",
    "girder-client>=3.1",
    # Pinned: upstream main ha riorganizzato i moduli (view_ui spostato);
    # questo commit corrisponde alla versione testata in locale
    "girdermedviewer @ git+https://github.com/KitwareMedical/GirderMedViewer.git@a2ff8d652bfd51d12bed3ded450bd1ddb58d969d",
    "vtk>=9.5",
    "wslink>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
]

[project.scripts]
diadema-trame = "diadema.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["diadema*"]
